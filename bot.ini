# Read-only bot configuration file.
# The bot parses this at startup but never writes to it.
# Feature flags live in the [features] section; future updates will use
# this file to enable and disable certain features (e.g. feature_name = true).

[features]
# feature_name = true
# Grant a persistent Season-# role to everyone who plays a reported match.
season_role = true
# Require players to join the #lobby voice channel before match setup and
# auto-move players into team voice channels once the match starts.
voice_presence = true
# Enable Duck Coins: earning, leaderboards, !bet, !doubledown, !setmap.
duck_coins = true
# Allow the legacy `!` prefix commands alongside the /slash commands.
# Set to false to reject `!` invocations (slash commands always work).
legacy_prefix_commands = true

[logging]
# Log level for console output: debug, info, warning (warn), error, critical.
level = info
# Mirror WARNING-and-above log records to a #bot-logs channel, if one exists.
log_to_discord = true
